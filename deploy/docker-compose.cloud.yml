version: "3.8"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  redis_data:
  static_volume:

services:
  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 60
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laptop_mon}
      MYSQL_USER: ${MYSQL_USER:-laptop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      USE_MYSQL: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SCREENSHOT_STORAGE_BACKEND: apps.screenshots.storage.S3ObjectStorageBackend
      SCREENSHOT_STORAGE_BUCKET: ${SCREENSHOT_STORAGE_BUCKET}
      SCREENSHOT_STORAGE_REGION: ${SCREENSHOT_STORAGE_REGION:-ap-south-1}
      SCREENSHOT_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      SCREENSHOT_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      SCREENSHOT_STORAGE_ENDPOINT: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    volumes:
      - static_volume:/app/static

  ingestion:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 30
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laptop_mon}
      MYSQL_USER: ${MYSQL_USER:-laptop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      USE_MYSQL: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SCREENSHOT_STORAGE_BACKEND: apps.screenshots.storage.S3ObjectStorageBackend
      SCREENSHOT_STORAGE_BUCKET: ${SCREENSHOT_STORAGE_BUCKET}
      SCREENSHOT_STORAGE_REGION: ${SCREENSHOT_STORAGE_REGION:-ap-south-1}
      SCREENSHOT_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      SCREENSHOT_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      SCREENSHOT_STORAGE_ENDPOINT: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laptop_mon}
      MYSQL_USER: ${MYSQL_USER:-laptop_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      USE_MYSQL: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SCREENSHOT_STORAGE_BACKEND: apps.screenshots.storage.S3ObjectStorageBackend
      SCREENSHOT_STORAGE_BUCKET: ${SCREENSHOT_STORAGE_BUCKET}
      SCREENSHOT_STORAGE_REGION: ${SCREENSHOT_STORAGE_REGION:-ap-south-1}
      SCREENSHOT_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      SCREENSHOT_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      SCREENSHOT_STORAGE_ENDPOINT: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - frontend_net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - api
      - ingestion
      - frontend
    networks:
      - frontend_net
