networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  redis_data:
    driver: local
  static_volume:
    driver: local

services:
  redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 60
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-prod-laptop-mon-saas-secret-key-2026-saptasurya}
      DJANGO_SECRET_KEY: ${SECRET_KEY:-prod-laptop-mon-saas-secret-key-2026-saptasurya}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laptop_mon}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Captain8959}
      MYSQL_HOST: ${MYSQL_HOST:-ls-a9672c75a2ced7bcb1d31a36844283e2525c2a08.ca3gawi2w7pu.us-east-1.rds.amazonaws.com}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      USE_MYSQL: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SCREENSHOT_STORAGE_BACKEND: apps.screenshots.storage.S3ObjectStorageBackend
      SCREENSHOT_STORAGE_BUCKET: ${SCREENSHOT_STORAGE_BUCKET:-${AWS_STORAGE_BUCKET_NAME:-captain8959}}
      SCREENSHOT_STORAGE_REGION: ${SCREENSHOT_STORAGE_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
      SCREENSHOT_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      SCREENSHOT_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      AWS_DEFAULT_REGION: ${SCREENSHOT_STORAGE_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
      SCREENSHOT_STORAGE_ENDPOINT: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    volumes:
      - static_volume:/app/static

  ingestion:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 30
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-prod-laptop-mon-saas-secret-key-2026-saptasurya}
      DJANGO_SECRET_KEY: ${SECRET_KEY:-prod-laptop-mon-saas-secret-key-2026-saptasurya}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-laptop_mon}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Captain8959}
      MYSQL_HOST: ${MYSQL_HOST:-ls-a9672c75a2ced7bcb1d31a36844283e2525c2a08.ca3gawi2w7pu.us-east-1.rds.amazonaws.com}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      USE_MYSQL: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SCREENSHOT_STORAGE_BACKEND: apps.screenshots.storage.S3ObjectStorageBackend
      SCREENSHOT_STORAGE_BUCKET: ${SCREENSHOT_STORAGE_BUCKET:-${AWS_STORAGE_BUCKET_NAME:-captain8959}}
      SCREENSHOT_STORAGE_REGION: ${SCREENSHOT_STORAGE_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
      SCREENSHOT_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      SCREENSHOT_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      AWS_DEFAULT_REGION: ${SCREENSHOT_STORAGE_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
      SCREENSHOT_STORAGE_ENDPOINT: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - frontend_net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - api
      - ingestion
      - frontend
    networks:
      - frontend_net
